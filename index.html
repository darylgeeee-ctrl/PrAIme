<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRhyme x PrAIme™ Master Studio Suite</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#030305',
                            card: '#08080c',
                            cyan: '#00f0ff',
                            magenta: '#ff007f',
                            crimson: '#dc143c',
                            gold: '#ffd700'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Three.js for 3D Turntables & Rokdabus Studio Rig -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #030305; color: #f3f4f6; overflow-x: hidden; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .glass-panel { background: rgba(8, 8, 12, 0.95); backdrop-filter: blur(24px); border: 1px solid rgba(0, 240, 255, 0.3); }
        .glow-magenta { text-shadow: 0 0 20px rgba(255, 0, 127, 0.9); }
        .glow-cyan { text-shadow: 0 0 20px rgba(0, 240, 255, 0.9); }
        .glow-box-magenta { box-shadow: 0 0 35px rgba(255, 0, 127, 0.45); }
        .glow-box-cyan { box-shadow: 0 0 35px rgba(0, 240, 255, 0.45); }
        @keyframes pulseGlow {
            0% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(0,240,255,0.6)); }
            50% { transform: scale(1.04); filter: drop-shadow(0 0 35px rgba(255,0,127,0.95)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(0,240,255,0.6)); }
        }
        .animate-rokdabus { animation: pulseGlow 3s ease-in-out infinite; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #030305; }
        ::-webkit-scrollbar-thumb { background: #ff007f; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen relative selection:bg-brand-magenta selection:text-white">

    <!-- Audio Engine Activation Splash -->
    <div id="audio-splash" class="fixed inset-0 z-50 bg-black/98 backdrop-blur-3xl flex flex-col items-center justify-center p-6 text-center space-y-6">
        <div class="w-24 h-24 rounded-3xl bg-gradient-to-tr from-brand-cyan via-brand-magenta to-brand-crimson flex items-center justify-center glow-box-magenta animate-bounce">
            <i class="fa-solid fa-volume-high text-white text-4xl"></i>
        </div>
        <div class="space-y-2 max-w-lg">
            <h1 class="font-orbitron text-3xl md:text-4xl font-black text-white glow-cyan">PRHYME x PrAIme™ MASTER SUITE</h1>
            <p class="text-xs md:text-sm text-gray-400">Click below to initialize the Web Audio synthesis engine, soundkit vault, and 3D studio environment.</p>
        </div>
        <button onclick="initAudioEngine()" class="px-8 py-4 rounded-2xl bg-gradient-to-r from-brand-cyan via-brand-magenta to-brand-crimson text-white font-orbitron font-black text-sm tracking-widest glow-box-magenta hover:scale-105 transition">
            INITIALIZE AUDIO ENGINE & LAUNCH STUDIO <i class="fa-solid fa-bolt ml-2"></i>
        </button>
    </div>

    <!-- Top Master Control Bar -->
    <header class="w-full bg-black/90 border-b border-brand-cyan/20 px-6 py-3 flex items-center justify-between sticky top-0 z-40 backdrop-blur-md">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="switchView('home')">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-magenta to-brand-cyan flex items-center justify-center glow-box-cyan">
                <i class="fa-solid fa-compact-disc text-white animate-spin text-lg"></i>
            </div>
            <div>
                <span class="font-orbitron font-black text-lg tracking-wider text-white">PRHYME</span>
                <span class="text-[10px] block text-brand-cyan font-mono tracking-widest">MASTER PRODUCTION SUITE</span>
            </div>
        </div>

        <!-- Live Frequency Spectrum Visualizer -->
        <div id="spectrum-bars" class="hidden lg:flex items-end space-x-1 h-8 px-4 bg-black/50 rounded-xl border border-white/5"></div>

        <div class="flex items-
